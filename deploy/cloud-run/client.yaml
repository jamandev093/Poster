apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: poster-client
spec:
  template:
    spec:
      serviceAccountName: SERVICE_ACCOUNT
      containers:
        - image: AR_REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/poster-client:SHORT_SHA
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_POSTER_API_BASE_URL
              value: https://api.getpostar.com
            - name: NEXT_PUBLIC_RAZORPAY_KEY_ID
              value: PUBLIC_RAZORPAY_KEY_ID_PLACEHOLDER
